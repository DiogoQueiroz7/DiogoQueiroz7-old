name: 🌆 Gerar contribuições em 3D

on:
  # Atualiza todo dia às 18h UTC (~15h no horário de MS)
  schedule:
    - cron: "0 18 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda a cada push na main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar SVGs 3D (skyline, estações, etc.)
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commitar os SVGs gerados
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "🌆 atualiza contribuições em 3D" || echo "nada para commitar"
          git push
